<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Goku RPG v0.4 Animated Fighter</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
margin:0;
background:#050a12;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

#game{
height:100vh;
height:100dvh;
position:relative;
overflow:hidden;
background:linear-gradient(
#168ce0 0%,
#70c9f4 48%,
#70aa47 49%,
#31552b 100%
);
}

/* BACKGROUND */

.mountain{
position:absolute;
bottom:39%;
width:0;
height:0;
border-left:110px solid transparent;
border-right:110px solid transparent;
border-bottom:190px solid #567c62;
opacity:.65;
}

.m1{left:-60px}
.m2{left:28%}
.m3{right:8%}

.ground{
position:absolute;
left:0;
right:0;
bottom:27%;
height:20%;
background:linear-gradient(#8bc65a,#8c743b);
border-top:5px solid #547d3b;
}

/* HUD */

.hud{
position:absolute;
top:9px;
width:43%;
z-index:20;
font-weight:bold;
text-shadow:1px 2px 3px #000;
}

.playerHUD{left:3%}
.enemyHUD{right:3%;text-align:right}

.name{
font-size:15px;
font-weight:900;
font-style:italic;
}

.bar{
height:16px;
background:#101820;
border:2px solid white;
border-radius:8px;
overflow:hidden;
margin-top:4px;
box-shadow:0 2px 4px #000;
}

.fill{
height:100%;
transition:width .2s;
}

#playerHP{
background:linear-gradient(90deg,#18ad45,#67f277);
}

#enemyHP{
background:linear-gradient(90deg,#ff3d3d,#9e0000);
}

#playerKI{
background:linear-gradient(90deg,#0074ff,#50dfff);
}

.stats{
font-size:10px;
margin-top:2px;
}

/* AUTO BUTTON */

#autoToggle{
position:absolute;
top:92px;
left:50%;
transform:translateX(-50%);
z-index:30;
border:2px solid white;
border-radius:15px;
padding:6px 15px;
background:#262d37;
color:white;
font-size:11px;
font-weight:900;
}

#autoToggle.autoOn{
background:#0d719e;
box-shadow:0 0 14px #32c8ff;
}

/* FIGHTERS */

.fighter{
position:absolute;
bottom:32%;
z-index:8;
transform-origin:bottom center;
}

#goku{
left:12%;
width:90px;
height:150px;
}

#saibaman{
right:12%;
width:80px;
height:120px;
}

.head{
position:absolute;
left:50%;
transform:translateX(-50%);
width:38px;
height:38px;
border-radius:50%;
}

.gokuHead{
background:#f0b47e;
top:5px;
}

.hair{
position:absolute;
top:-18px;
left:2px;
font-size:43px;
color:#111;
transform:rotate(-15deg);
}

.body{
position:absolute;
left:50%;
transform:translateX(-50%);
top:39px;
width:48px;
height:60px;
border-radius:10px;
}

.gokuBody{
background:#f47721;
border:7px solid #f47721;
}

.blueShirt{
position:absolute;
top:0;
left:12px;
width:24px;
height:18px;
background:#123c9d;
}

.arm{
position:absolute;
top:46px;
width:18px;
height:58px;
background:#eaa66e;
border-radius:10px;
transform-origin:top center;
}

.armL{
left:8px;
transform:rotate(15deg);
}

.armR{
right:8px;
transform:rotate(-15deg);
}

.leg{
position:absolute;
top:92px;
width:24px;
height:57px;
background:#f47721;
border-radius:8px;
transform-origin:top center;
}

.legL{
left:18px;
transform:rotate(8deg);
}

.legR{
right:18px;
transform:rotate(-8deg);
}

.boot{
position:absolute;
bottom:-2px;
width:29px;
height:16px;
background:#173c91;
border-radius:5px;
}

/* PIXEL FIGHTER v0.4 */
.spriteGoku{filter:drop-shadow(0 4px 0 rgba(0,0,0,.28));image-rendering:pixelated}
.spriteGoku .spriteHair{position:absolute;left:21px;top:-3px;width:50px;height:46px;background:#101014;clip-path:polygon(0 58%,18% 42%,7% 20%,31% 30%,30% 3%,48% 24%,64% 0,66% 28%,94% 15%,78% 45%,100% 52%,68% 66%,34% 68%)}
.spriteFace{position:absolute;left:31px;top:27px;width:30px;height:31px;background:#efae78;border:3px solid #17151b;clip-path:polygon(8% 0,100% 10%,86% 90%,45% 100%,0 72%)}
.spriteTorso{position:absolute;left:25px;top:54px;width:46px;height:48px;background:linear-gradient(135deg,#ff8b18 0 58%,#d94b0d 59%);border:4px solid #17151b;clip-path:polygon(15% 0,86% 5%,100% 85%,52% 100%,0 82%);box-shadow:inset 0 12px 0 #173d9b}
.spriteArm{position:absolute;width:17px;height:54px;background:#efa66f;border:4px solid #17151b;border-radius:9px;transform-origin:50% 10%}
.backArm{left:15px;top:59px;transform:rotate(24deg)}
.frontArm{left:66px;top:58px;transform:rotate(-31deg)}
.spriteLeg{position:absolute;top:96px;width:27px;height:55px;background:#f27612;border:4px solid #17151b;border-radius:8px;transform-origin:50% 5%;box-shadow:inset 0 -14px 0 #183f99}
.backLeg{left:20px;transform:rotate(12deg)}
.frontLeg{left:51px;transform:rotate(-10deg)}
.jab .frontArm{animation:armJab .38s ease-out}.cross .frontArm{animation:armCross .48s ease-out}.frontKick .frontLeg{animation:legFront .52s ease-out}.heavyKick .frontLeg{animation:legHeavy .62s ease-out}
@keyframes armJab{45%{transform:translate(38px,-7px) rotate(-88deg) scaleY(1.3)}}
@keyframes armCross{50%{transform:translate(42px,-2px) rotate(-82deg) scaleY(1.35)}}
@keyframes legFront{55%{transform:translate(48px,-20px) rotate(-88deg) scaleY(1.2)}}
@keyframes legHeavy{50%{transform:translate(45px,-45px) rotate(-108deg) scaleY(1.25)}}

/* SAIBAMAN */

.sHead{
background:#7cad38;
top:0;
border:3px solid #41671e;
}

.sBody{
background:#6e9f34;
top:35px;
width:48px;
height:53px;
}

.eye{
position:absolute;
top:13px;
width:9px;
height:5px;
background:red;
box-shadow:0 0 6px red;
}

.eye1{left:7px}
.eye2{right:7px}

.sArm{
background:#78a63b;
height:45px;
top:40px;
}

.sLeg{
background:#6d9634;
height:43px;
top:82px;
}

/* SHADOWS */

.shadow{
position:absolute;
bottom:31%;
width:95px;
height:17px;
border-radius:50%;
background:rgba(0,0,0,.35);
filter:blur(3px);
z-index:3;
}

.shadowG{left:11%}
.shadowS{right:10%}

/* IDLE */

.idle{
animation:idle .8s infinite alternate ease-in-out;
}

@keyframes idle{
from{transform:translateY(0)}
to{transform:translateY(-4px)}
}

/* BASIC ATTACKS */

.jab{
animation:jab .38s ease-out;
}

@keyframes jab{
0%{transform:translateX(0)}
35%{transform:translateX(95px)}
50%{transform:translateX(115px) scaleX(1.08)}
100%{transform:translateX(0)}
}

.cross{
animation:cross .48s ease-out;
}

@keyframes cross{
0%{transform:translateX(0) rotate(0)}
45%{transform:translateX(110px) rotate(-7deg)}
60%{transform:translateX(125px) rotate(8deg) scale(1.08)}
100%{transform:translateX(0) rotate(0)}
}

.frontKick{
animation:frontKick .52s ease-out;
}

@keyframes frontKick{
0%{transform:translateX(0)}
40%{transform:translateX(100px) rotate(-3deg)}
58%{transform:translateX(135px) rotate(5deg) scaleX(1.12)}
100%{transform:translateX(0)}
}

.heavyKick{
animation:heavyKick .62s ease-out;
}

@keyframes heavyKick{
0%{transform:translateX(0) rotate(0)}
35%{transform:translateX(80px) rotate(-8deg)}
58%{transform:translateX(140px) rotate(15deg) scale(1.12)}
100%{transform:translateX(0) rotate(0)}
}

.enemyAttack{
animation:enemyAttack .45s ease-out;
}

@keyframes enemyAttack{
0%{transform:translateX(0)}
50%{transform:translateX(-125px) scale(1.08)}
100%{transform:translateX(0)}
}

/* HIT */

.hit{
animation:hit .25s;
}

@keyframes hit{
25%{filter:brightness(3)}
50%{transform:translateX(10px)}
75%{transform:translateX(-7px)}
}

/* PROJECTILE */

.projectile{
position:absolute;
width:27px;
height:27px;
border-radius:50%;
background:white;
box-shadow:
0 0 10px #fff,
0 0 25px #00aaff,
0 0 45px #008cff;
z-index:15;
display:none;
}

#kiBall{
left:24%;
bottom:44%;
}

.fireKi{
display:block;
animation:kiFly .5s linear forwards;
}

@keyframes kiFly{
from{left:24%}
to{left:78%}
}

/* KAMEHAMEHA */

#beam{
display:none;
position:absolute;
left:24%;
right:18%;
bottom:43%;
height:28px;
background:white;
border-radius:50px;
box-shadow:
0 0 15px white,
0 0 30px #00b7ff,
0 0 65px #0077ff;
z-index:14;
transform-origin:left;
}

.fireBeam{
display:block!important;
animation:beam .85s;
}

@keyframes beam{
0%{transform:scaleX(0)}
25%{transform:scaleX(1)}
75%{transform:scaleX(1)}
100%{
transform:scaleX(1);
opacity:0;
}
}

/* METEOR COMBO */

.meteor{
animation:meteor .9s ease-in-out;
}

@keyframes meteor{
0%{transform:translateX(0)}
20%{transform:translateX(140px) translateY(-15px)}
35%{transform:translateX(150px) rotate(10deg)}
50%{transform:translateX(135px) rotate(-12deg)}
70%{transform:translateX(145px) translateY(-25px)}
100%{transform:translateX(0)}
}

/* SPIRIT BOMB */

#spiritBomb{
display:none;
position:absolute;
left:18%;
bottom:55%;
width:125px;
height:125px;
border-radius:50%;
background:white;
box-shadow:
0 0 30px white,
0 0 65px #65cfff,
0 0 110px #008cff;
z-index:15;
}

.spiritFire{
display:block!important;
animation:spirit 1.4s forwards;
}

@keyframes spirit{
0%{
transform:scale(.1);
left:18%;
bottom:57%;
}
40%{
transform:scale(1);
left:18%;
bottom:57%;
}
100%{
transform:scale(.45);
left:73%;
bottom:39%;
}
}

/* DAMAGE */

.damage{
position:absolute;
font-size:25px;
font-weight:900;
color:#ff3838;
text-shadow:
-2px -2px #000,
2px 2px #000;
z-index:40;
animation:damageFloat .8s forwards;
pointer-events:none;
}

@keyframes damageFloat{
to{
transform:translateY(-70px) scale(1.2);
opacity:0;
}
}

/* COMBAT TEXT */

#combatText{
position:absolute;
bottom:27%;
width:100%;
text-align:center;
font-size:14px;
font-weight:900;
text-shadow:2px 2px 3px #000;
z-index:20;
}

/* ABILITY BAR */

.controls{
position:absolute;
bottom:0;
left:0;
right:0;
height:25%;
background:rgba(3,8,18,.95);
display:flex;
gap:5px;
padding:7px;
z-index:25;
}

.skill{
flex:1;
border:2px solid #368fd5;
border-radius:10px;
color:white;
font-weight:900;
background:linear-gradient(#155b91,#071d35);
font-size:9px;
position:relative;
overflow:hidden;
padding:3px;
}

.skill::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
height:40%;
background:linear-gradient(
rgba(74,188,255,.5),
transparent
);
}

.skill:disabled{
opacity:.32;
filter:grayscale(.8);
}

.skillName{
position:relative;
z-index:2;
display:block;
}

.cost{
display:block;
position:relative;
z-index:2;
color:#55d3ff;
margin-top:5px;
font-size:10px;
}

.ultimate{
border-color:#9a72ff;
background:linear-gradient(#4a2e98,#160b3e);
}

/* RESULTS */

#result{
display:none;
position:absolute;
z-index:50;
top:34%;
width:100%;
text-align:center;
font-size:42px;
font-weight:900;
text-shadow:3px 4px #000;
}

#restart{
display:none;
position:absolute;
z-index:51;
top:47%;
left:35%;
width:30%;
height:55px;
border-radius:12px;
border:2px solid white;
background:#153e70;
color:white;
font-weight:bold;
}

.screenShake{
animation:shake .3s;
}

@keyframes shake{
0%,100%{transform:translate(0)}
25%{transform:translate(5px,2px)}
50%{transform:translate(-5px,-2px)}
75%{transform:translate(4px,-1px)}
}
</style>
</head>

<body>

<div id="game">

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>
<div class="ground"></div>

<div class="hud playerHUD">
<div class="name">GOKU</div>
<div class="bar">
<div id="playerHP" class="fill"></div>
</div>
<div class="bar">
<div id="playerKI" class="fill"></div>
</div>
<div id="gStats" class="stats"></div>
</div>

<div class="hud enemyHUD">
<div class="name">TRAINING SAIBAMAN</div>
<div class="bar">
<div id="enemyHP" class="fill"></div>
</div>
<div id="eStats" class="stats"></div>
</div>

<button id="autoToggle" onclick="toggleAuto()">
MANUAL
</button>

<div class="shadow shadowG"></div>
<div class="shadow shadowS"></div>

<!-- GOKU -->

<div id="goku" class="fighter idle spriteGoku" aria-label="Goku">
  <div class="spriteHair"></div>
  <div class="spriteFace"></div>
  <div class="spriteTorso"></div>
  <div class="spriteArm backArm"></div>
  <div class="spriteArm frontArm"></div>
  <div class="spriteLeg backLeg"></div>
  <div class="spriteLeg frontLeg"></div>
</div>

<!-- SAIBAMAN -->

<div id="saibaman" class="fighter idle">

<div class="head sHead">
<div class="eye eye1"></div>
<div class="eye eye2"></div>
</div>

<div class="body sBody"></div>

<div class="arm armL sArm"></div>
<div class="arm armR sArm"></div>

<div class="leg legL sLeg"></div>
<div class="leg legR sLeg"></div>

</div>

<div id="kiBall" class="projectile"></div>
<div id="beam"></div>
<div id="spiritBomb"></div>

<div id="combatText">
Battle started!
</div>

<div id="result"></div>

<button
id="restart"
onclick="location.reload()">
FIGHT AGAIN
</button>

<div class="controls">

<button
id="kiBtn"
class="skill"
onclick="useKiBlast(false)">

<span class="skillName">
KI BLAST
</span>

<span class="cost">
20 KI
</span>

</button>

<button
id="meteorBtn"
class="skill"
onclick="useMeteor(false)">

<span class="skillName">
METEOR COMBO
</span>

<span class="cost">
40 KI
</span>

</button>

<button
id="kameBtn"
class="skill"
onclick="useKamehameha(false)">

<span class="skillName">
KAMEHAMEHA
</span>

<span class="cost">
70 KI
</span>

</button>

<button
id="spiritBtn"
class="skill ultimate"
onclick="useSpiritBomb(false)">

<span class="skillName">
ULTIMATE<br>SPIRIT BOMB
</span>

<span class="cost">
100 KI
</span>

</button>

</div>
</div>

<script>

/* =========================
   COMBAT DATA
========================= */

let goku={
hp:850,
maxHp:850,
attack:80,
defence:45,
ki:0,
maxKi:100
};

let enemy={
hp:1000,
maxHp:1000,
attack:75,
defence:40
};

let battleOver=false;
let autoMode=false;
let abilityBusy=false;

const $=id=>
document.getElementById(id);

/* =========================
   HUD
========================= */

function updateHUD(){

$("playerHP").style.width=
(goku.hp/goku.maxHp*100)+"%";

$("enemyHP").style.width=
(enemy.hp/enemy.maxHp*100)+"%";

$("playerKI").style.width=
(goku.ki/goku.maxKi*100)+"%";

$("gStats").innerText=
Math.ceil(goku.hp)+
" / 850 HP • "+
Math.floor(goku.ki)+
" / 100 KI";

$("eStats").innerText=
Math.ceil(enemy.hp)+
" / 1000 HP";

$("kiBtn").disabled=
battleOver||
abilityBusy||
goku.ki<20;

$("meteorBtn").disabled=
battleOver||
abilityBusy||
goku.ki<40;

$("kameBtn").disabled=
battleOver||
abilityBusy||
goku.ki<70;

$("spiritBtn").disabled=
battleOver||
abilityBusy||
goku.ki<100;
}

function combatText(message){
$("combatText").innerText=message;
}

/* =========================
   AUTO MODE
========================= */

function toggleAuto(){

autoMode=!autoMode;

let button=$("autoToggle");

if(autoMode){

button.innerText="AUTO";
button.classList.add("autoOn");

combatText(
"Auto abilities enabled"
);

}else{

button.innerText="MANUAL";
button.classList.remove("autoOn");

combatText(
"Manual abilities enabled"
);

}
}

/* =========================
   DAMAGE NUMBERS
========================= */

function damageNumber(target,amount){

let fighter=$(target);
let rect=
fighter.getBoundingClientRect();

let number=
document.createElement("div");

number.className="damage";
number.innerText="-"+amount;

number.style.left=
(rect.left+
rect.width/2)+"px";

number.style.top=
rect.top+"px";

document.body.appendChild(number);

setTimeout(()=>{
number.remove();
},800);
}

/* =========================
   HIT REACTION
========================= */

function hitEffect(target){

let fighter=$(target);

fighter.classList.remove("idle");
fighter.classList.add("hit");

setTimeout(()=>{

fighter.classList.remove("hit");
fighter.classList.add("idle");

},260);
}

function shake(){

$("game").classList.add(
"screenShake"
);

setTimeout(()=>{

$("game").classList.remove(
"screenShake"
);

},300);
}

/* =========================
   DAMAGE
========================= */

function hurtEnemy(damage,label){

if(battleOver)return;

enemy.hp=
Math.max(
0,
enemy.hp-damage
);

damageNumber(
"saibaman",
damage
);

hitEffect(
"saibaman"
);

combatText(
label+
" • "+
damage+
" damage"
);

checkBattle();
updateHUD();
}

function hurtGoku(damage){

if(battleOver)return;

goku.hp=
Math.max(
0,
goku.hp-damage
);

damageNumber(
"goku",
damage
);

hitEffect(
"goku"
);

combatText(
"Saibaman hit Goku • "+
damage+
" damage"
);

checkBattle();
updateHUD();
}

/* =========================
   BASIC ATTACK SYSTEM
========================= */

const basicAttacks=[

{
name:"Jab",
animation:"jab",
damage:30,
impact:190,
duration:400
},

{
name:"Cross",
animation:"cross",
damage:34,
impact:240,
duration:500
},

{
name:"Front Kick",
animation:"frontKick",
damage:38,
impact:270,
duration:540
},

{
name:"Heavy Kick",
animation:"heavyKick",
damage:43,
impact:330,
duration:650
}

];

function gokuBasic(){

if(
battleOver||
abilityBusy
)return;

let attack=
basicAttacks[
Math.floor(
Math.random()*
basicAttacks.length
)
];

let fighter=$("goku");

fighter.classList.remove("idle");

fighter.classList.add(
attack.animation
);

setTimeout(()=>{

if(battleOver)return;

hurtEnemy(
attack.damage,
attack.name
);

},attack.impact);

setTimeout(()=>{

fighter.classList.remove(
attack.animation
);

fighter.classList.add("idle");

},attack.duration);
}

/* =========================
   ENEMY BASIC ATTACK
========================= */

function enemyBasic(){

if(battleOver)return;

let fighter=$("saibaman");

fighter.classList.remove("idle");
fighter.classList.add(
"enemyAttack"
);

setTimeout(()=>{

if(battleOver)return;

let damage=30;

hurtGoku(damage);

},220);

setTimeout(()=>{

fighter.classList.remove(
"enemyAttack"
);

fighter.classList.add("idle");

},470);
}

/* =========================
   KI BLAST
========================= */

function useKiBlast(fromAI){

if(
battleOver||
abilityBusy||
goku.ki<20
)return;

abilityBusy=true;
goku.ki-=20;

updateHUD();

combatText(
fromAI
?
"Goku chose Ki Blast!"
:
"Ki Blast!"
);

let ball=$("kiBall");

ball.classList.add("fireKi");

setTimeout(()=>{

hurtEnemy(
65,
"Ki Blast"
);

ball.classList.remove(
"fireKi"
);

abilityBusy=false;

updateHUD();

},500);
}

/* =========================
   METEOR COMBO
========================= */

function useMeteor(fromAI){

if(
battleOver||
abilityBusy||
goku.ki<40
)return;

abilityBusy=true;
goku.ki-=40;

updateHUD();

combatText(
fromAI
?
"Goku chose Meteor Combo!"
:
"Meteor Combo!"
);

let fighter=$("goku");

fighter.classList.remove("idle");
fighter.classList.add("meteor");

/* multiple impacts */

setTimeout(()=>{
hurtEnemy(
25,
"Meteor Combo"
);
},250);

setTimeout(()=>{
hurtEnemy(
25,
"Meteor Combo"
);
},430);

setTimeout(()=>{
hurtEnemy(
35,
"Meteor Combo"
);
shake();
},650);

setTimeout(()=>{

fighter.classList.remove(
"meteor"
);

fighter.classList.add("idle");

abilityBusy=false;

updateHUD();

},920);
}

/* =========================
   KAMEHAMEHA
========================= */

function useKamehameha(fromAI){

if(
battleOver||
abilityBusy||
goku.ki<70
)return;

abilityBusy=true;
goku.ki-=70;

updateHUD();

combatText(
fromAI
?
"Goku chose Kamehameha!"
:
"KAMEHAMEHA!"
);

let beam=$("beam");

beam.classList.add(
"fireBeam"
);

setTimeout(()=>{

hurtEnemy(
170,
"Kamehameha"
);

shake();

},450);

setTimeout(()=>{

beam.classList.remove(
"fireBeam"
);

abilityBusy=false;

updateHUD();

},900);
}

/* =========================
   ULTIMATE
========================= */

function useSpiritBomb(fromAI){

if(
battleOver||
abilityBusy||
goku.ki<100
)return;

abilityBusy=true;
goku.ki-=100;

updateHUD();

combatText(
fromAI
?
"Goku unleashed his Ultimate!"
:
"SPIRIT BOMB!"
);

let bomb=$("spiritBomb");

bomb.classList.add(
"spiritFire"
);

setTimeout(()=>{

hurtEnemy(
260,
"Spirit Bomb"
);

shake();

},1250);

setTimeout(()=>{

bomb.classList.remove(
"spiritFire"
);

abilityBusy=false;

updateHUD();

},1450);
}

/* =========================
   AUTO ABILITY AI
========================= */

function autoDecision(){

if(
!autoMode||
battleOver||
abilityBusy
)return;

let ki=goku.ki;

let roll=Math.random();

/*
The AI does NOT automatically
spend Ki as soon as possible.

It sometimes saves Ki for
stronger abilities.
*/

if(ki>=100){

if(roll<.70){
useSpiritBomb(true);
return;
}

if(roll<.90){
useKamehameha(true);
return;
}

}

if(ki>=70){

if(roll<.45){
useKamehameha(true);
return;
}

if(roll<.62){
useMeteor(true);
return;
}

}

if(ki>=40){

if(roll<.25){
useMeteor(true);
return;
}

}

if(ki>=20){

/*
Low chance prevents constant
Ki Blast spam and lets Goku
save energy.
*/

if(roll<.08){
useKiBlast(true);
return;
}

}
}

/* =========================
   BATTLE END
========================= */

function checkBattle(){

if(enemy.hp<=0){

endBattle(
"VICTORY!"
);

}else if(goku.hp<=0){

endBattle(
"DEFEAT"
);

}
}

function endBattle(result){

battleOver=true;

$("result").innerText=result;
$("result").style.display="block";

$("restart").style.display="block";

combatText(
result==="VICTORY!"
?
"Training Saibaman defeated!"
:
"Goku was defeated."
);

updateHUD();
}

/* =========================
   KI REGEN
========================= */

/*
2.5 KI PER SECOND
*/

setInterval(()=>{

if(!battleOver){

goku.ki=
Math.min(
goku.maxKi,
goku.ki+.25
);

updateHUD();

}

},100);

/* =========================
   COMBAT LOOPS
========================= */

/*
Basic attacks remain automatic
even in MANUAL mode.
*/

setInterval(
gokuBasic,
1800
);

setInterval(
enemyBasic,
2300
);

/*
AI considers an ability
roughly every 1.2 seconds.
*/

setInterval(
autoDecision,
1200
);

updateHUD();

</script>
